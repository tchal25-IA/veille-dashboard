<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veille Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>📊 Veille Dashboard</h1>

    <label for="date-select">Date :</label>
    <select id="date-select"></select>
    <span id="last-update"></span>
  </div>
</header>

<main id="app">
  <div id="loading">Chargement...</div>
  <div id="empty" class="hidden">
    <p>Aucune donnée pour le moment. Le premier rapport de veille apparaîtra ici après la prochaine exécution planifiée.</p>
  </div>
  <div id="categories"></div>
</main>

<footer>
  <p>Généré automatiquement chaque jour — Hermes Agent</p>
</footer>

<script src="app.js"></script>
</body>
</html>
